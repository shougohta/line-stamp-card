<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店頭QRコード | まちスタンプ</title>
<link rel="stylesheet" href="style.css">
<style>
  .sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .poster { border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 8px; justify-items: center; text-align: center; break-inside: avoid; }
  .poster .qr img, .poster .qr canvas { width: 180px; height: 180px; }
  .url { font-size: 10.5px; color: var(--muted); word-break: break-all; }
  .wide { max-width: 960px; }
</style>
</head>
<body>
<main class="app wide">
  <h1>店頭に置くQRコード</h1>
  <p class="muted" id="note"></p>
  <div class="sheet-grid" id="grid"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
  var cfg = window.APP_CONFIG;
  var mock = !cfg.liffId;
  var appUrl = new URL("index.html", location.href).href;
  document.getElementById("note").textContent = mock
    ? "デモ用です。読み取るとこのPCのデモ画面が開きます。LIFF IDを設定すると、LINEで開くQRコードに切り替わります。"
    : "LINEのカメラか、アプリ内の読み取りボタンで読み取るとスタンプが押されます。";
  var grid = document.getElementById("grid");
  cfg.stores.forEach(function (s) {
    var url = mock ? appUrl + "?mock=1&store=" + s.id : "https://miniapp.line.me/" + cfg.liffId + "?store=" + s.id;
    var box = document.createElement("div");
    box.className = "poster";
    box.innerHTML = '<h2></h2><p class="muted"></p><div class="qr"></div><p class="url"></p>';
    box.querySelector("h2").textContent = s.name;
    box.querySelector(".muted").textContent = s.area + "｜" + cfg.appName;
    box.querySelector(".url").textContent = url;
    grid.appendChild(box);
    new QRCode(box.querySelector(".qr"), { text: url, width: 360, height: 360, correctLevel: QRCode.CorrectLevel.M });
  });
})();
</script>
</body>
</html>
